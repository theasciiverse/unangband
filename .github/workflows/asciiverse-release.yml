# Builds Unangband for the Asciiverse catalog: one archive per target,
# named unangband-<target>.tar.gz, plus a SHA256SUMS file, attached to a
# GitHub release (hub/catalog/SCHEMA.md, release.source = "github"). Each
# archive holds the unangband program, the read-only lib folder it reads
# beside itself (edit, file, help, info, pref), the licence, our README
# and PATCHES.md.
#
# Tags look like v0.7.0-pre1-11-av.1: upstream's version and the commits
# on top of it, then our packaging release. Linux builds are fully static
# (Alpine, musl, ncurses); macOS builds both architectures on one runner
# against the system curses. Curses frontend only. No Windows build (see
# PATCHES.md).

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: unangband
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file unangband
          sh asciiverse/stage.sh

      - name: Smoke test
        run: |
          # the program must find lib/ beside itself and make its state folder
          (cd /tmp && script -qec "TERM=xterm HOME=/tmp/h timeout 5 $PWD/stage/unangband" /dev/null </dev/null || true) >smoke.log
          grep -aq "Unnamed Angband" smoke.log || { tail -c 2000 smoke.log; exit 1; }
          ls /tmp/h/.local/state/unangband

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          CC_ARCH=${{ matrix.arch }} sh asciiverse/build.sh
          file unangband
          otool -L unangband
          sh asciiverse/stage.sh

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Unangband $TAG" \
                 --notes "Unangband ${TAG%%-av.*} by Andrew Doull, Duncan Lowther (DGoldDragon28) and others (github.com/DGoldDragon28/Unangband), the curses (terminal) build for the Asciiverse catalog, for Linux and macOS. GPL-2.0. See PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
